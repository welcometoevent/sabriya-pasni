<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Your invitation | Welcome to Event</title><style>
:root{font-family:system-ui,sans-serif;color:#352d30;background:#faf5ef}*{box-sizing:border-box}body{margin:0}header{padding:22px 6%;background:#fff;border-bottom:1px solid #ebdcd7}header a{color:#9a5866;text-decoration:none;font-weight:700;letter-spacing:.08em}main{max-width:720px;margin:60px auto;padding:0 18px}.card{background:#fff;border:1px solid #eadbd4;border-radius:22px;padding:clamp(24px,5vw,48px);box-shadow:0 18px 50px #593c3610}h1{font:500 clamp(36px,6vw,56px) Georgia,serif;margin:12px 0}h2{font:500 26px Georgia,serif}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:#a86670;font-weight:700}.muted{color:#77676b;line-height:1.8}label{display:block;font-weight:600;margin:20px 0 8px}input{width:100%;padding:14px;border:1px solid #d9c5c0;border-radius:10px;font:inherit}fieldset{border:0;padding:0;margin:20px 0}legend{font-weight:600;margin-bottom:10px}.options{display:flex;gap:12px;flex-wrap:wrap}.options label{margin:0;display:flex;align-items:center;gap:8px;border:1px solid #eadbd4;border-radius:12px;padding:14px;flex:1;min-width:160px}.options input{width:auto}button{background:#a86670;color:#fff;border:0;border-radius:12px;padding:15px 24px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:20px}button:disabled{opacity:.6}.error{color:#a02b35}.success{color:#216b46}a{color:#a86670}</style></head><body><header><a href="/">WELCOME TO EVENT ✦</a></header><main><div class="card"><div class="eyebrow">A celebration with love</div><div id="loading" role="status">Verifying your invitation…</div><div id="invalid" hidden><h1>Invitation link needed</h1><p class="muted" id="error">Please open the personal invitation link sent by your host.</p></div><div id="content" hidden><p class="eyebrow">You're invited</p><h1 id="eventTitle"></h1><p class="muted" id="greeting"></p><p id="eventDetails" class="muted"></p><h2>Kindly RSVP</h2><form id="form"><label for="name">Your name</label><input id="name" maxlength="120" autocomplete="name" required><fieldset><legend>Will you attend?</legend><div class="options"><label><input type="radio" name="attending" value="yes" required> Joyfully accepts</label><label><input type="radio" name="attending" value="no"> Regretfully declines</label></div></fieldset><div id="party" hidden><label for="count">Total attending (including you)</label><input type="number" id="count" min="1" max="10" value="1"></div><button id="submit">Send RSVP</button><p id="status" role="status" aria-live="polite"></p></form></div></div></main><script>
const API='https://vpspirigruwcgnqlwbla.supabase.co/functions/v1/invitations';
const KEY='sb_publishable_O-j4VaGRYGpY8WjwmjMDLA_HWfZ7rns';
const token=new URLSearchParams(location.search).get('invite')||'';
const el=id=>document.getElementById(id);
async function call(action,body={}){const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify({action,token,...body})});const data=await res.json();if(!res.ok)throw Error(data.error||'Request failed');return data}
async function start(){try{if(!/^[a-f0-9]{64}$/.test(token))throw Error('Please open your personalized invitation link.');const data=await call('guest.view');el('eventTitle').textContent=data.event.title;el('greeting').textContent='Dear '+data.household_name+', we would love to celebrate with you.';const parts=[];if(data.event.event_date)parts.push(new Date(data.event.event_date).toLocaleString('en-US',{dateStyle:'full',timeStyle:'short',timeZone:'America/New_York'}));if(data.event.venue)parts.push(data.event.venue);el('eventDetails').textContent=parts.join(' · ');el('count').max=data.max_guests;if(data.rsvp){el('name').value=data.rsvp.guest_name;el('form').elements.attending.value=data.rsvp.attending?'yes':'no';el('count').value=data.rsvp.guest_count||1;el('party').hidden=!data.rsvp.attending;el('status').textContent='You can update your previous response.'}el('content').hidden=false}catch(err){el('error').textContent=err.message;el('invalid').hidden=false}finally{el('loading').hidden=true}}
el('form').addEventListener('change',()=>{const yes=el('form').elements.attending.value==='yes';el('party').hidden=!yes;el('count').required=yes});
el('form').addEventListener('submit',async e=>{e.preventDefault();const btn=el('submit');btn.disabled=true;el('status').textContent='Saving…';try{const attending=el('form').elements.attending.value==='yes';await call('guest.rsvp',{guest_name:el('name').value,attending,guest_count:attending?Number(el('count').value):0});el('status').className='success';el('status').textContent='Thank you! Your RSVP has been saved.'}catch(err){el('status').className='error';el('status').textContent=err.message}finally{btn.disabled=false}});start();
</script></body></html>
