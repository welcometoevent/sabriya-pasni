<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>My events | Welcome to Event</title><style>
:root{font-family:system-ui,sans-serif;color:#332a32;background:#faf7f4}*{box-sizing:border-box}body{margin:0}header{display:flex;justify-content:space-between;align-items:center;gap:12px;background:white;padding:20px clamp(20px,6vw,80px);border-bottom:1px solid #eee0dd}.brand{font:600 22px Georgia,serif;color:#a45e70;text-decoration:none}main{max-width:1050px;margin:45px auto;padding:0 20px}h1{font:500 42px Georgia,serif;margin:8px 0}h2{font:500 25px Georgia,serif}p{color:#756a71;line-height:1.6}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a45e70;font-weight:700}.panel{background:white;border:1px solid #ebdedc;border-radius:18px;padding:28px}.auth{max-width:430px;margin:70px auto}label{display:block;font-weight:650;font-size:13px;margin:18px 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid #dac9c5;border-radius:9px;font:inherit}textarea{min-height:95px}button{background:#a45e70;color:white;padding:12px 18px;border:0;border-radius:10px;font:inherit;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#f2e6e4;color:#744b57}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px}.event{background:#fff;border:1px solid #ebdedc;border-radius:16px;padding:22px}.event h3{font:500 25px Georgia,serif;margin:8px 0}.event small{color:#a45e70}.event p{font-size:14px}.event a{color:#9b5066}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.error{color:#a32e39}.success{color:#28774e}.notice{margin-top:12px}@media(max-width:650px){.two{grid-template-columns:1fr}h1{font-size:34px}}
</style></head><body><header><a class="brand" href="/">Welcome to Event</a><button id="logout" class="secondary hidden">Log out</button></header><main>
<section id="auth" class="panel auth"><div class="eyebrow">Your celebrations</div><h1>Welcome back.</h1><p>Sign in or create your free organizer account.</p><form id="authForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><div class="two" style="margin-top:22px"><button id="login">Log in</button><button id="signup" type="button" class="secondary">Sign up</button></div></form><p id="authMsg" class="notice" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="toolbar"><div><div class="eyebrow">Organizer dashboard</div><h1>My events</h1><p>Create a celebration, then manage its details in one place.</p></div><button id="toggleCreate">+ Create event</button></div><section id="create" class="panel hidden" style="margin:22px 0"><h2>New event</h2><form id="eventForm"><label for="title">Event title</label><input id="title" maxlength="120" required placeholder="e.g. Sabriya's Pasni"><div class="two"><div><label for="slug">Event URL name</label><input id="slug" required pattern="[a-z0-9-]{3,80}" placeholder="sabriyas-pasni"></div><div><label for="mode">Invitation access</label><select id="mode"><option value="invite_only">Invite-only (personal links)</option><option value="shared_link">Anyone with the link (coming soon)</option><option value="public">Public (coming soon)</option></select></div></div><div class="two"><div><label for="date">Date and time</label><input id="date" type="datetime-local" required></div><div><label for="venue">Venue</label><input id="venue" maxlength="240" placeholder="Venue and address"></div></div><label for="description">Description</label><textarea id="description" maxlength="2000" placeholder="Tell your guests what you're celebrating"></textarea><button id="save" style="margin-top:20px">Save event</button><p id="createMsg" class="notice" role="status"></p></form></section><section id="events" class="cards"></section><p id="listMsg" class="notice" role="status"></p></section></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://vpspirigruwcgnqlwbla.supabase.co','sb_publishable_O-j4VaGRYGpY8WjwmjMDLA_HWfZ7rns');
const el=id=>document.getElementById(id);
let user=null;
function view(){el('auth').classList.toggle('hidden',!!user);el('dashboard').classList.toggle('hidden',!user);el('logout').classList.toggle('hidden',!user)}
function msg(id,t,err=false){el(id).textContent=t;el(id).className='notice '+(err?'error':'success')}
async function refresh(){if(!user)return;msg('listMsg','Loading events…');const{data,error}=await db.from('events').select('id,title,slug,access_mode,starts_at,venue,description,created_at').eq('owner_id',user.id).order('created_at',{ascending:false});if(error){msg('listMsg',error.message,true);return}const box=el('events');box.replaceChildren();for(const ev of data){const card=document.createElement('article');card.className='event';const type=document.createElement('small');type.textContent=ev.access_mode.replace('_',' ').toUpperCase();const h=document.createElement('h3');h.textContent=ev.title;const info=document.createElement('p');info.textContent=[ev.starts_at?new Date(ev.starts_at).toLocaleString():'Date TBD',ev.venue].filter(Boolean).join(' · ');const slug=document.createElement('p');slug.textContent='Event slug: '+ev.slug;card.append(type,h,info,slug);const note=document.createElement('p');note.textContent='Saved as a draft. Guest invitation pages are enabled after backend deployment.';card.append(note);box.append(card)}msg('listMsg',data.length?data.length+' event(s)':'No events yet. Create your first one!')}
el('authForm').addEventListener('submit',async e=>{e.preventDefault();const{data,error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error){msg('authMsg',error.message,true);return}user=data.user;view();await refresh()});
el('signup').addEventListener('click',async()=>{const{data,error}=await db.auth.signUp({email:el('email').value.trim(),password:el('password').value});if(error){msg('authMsg',error.message,true);return}msg('authMsg',data.session?'Account created. You are signed in.':'Check your email for a confirmation link before logging in.');if(data.session){user=data.user;view();await refresh()}});
el('logout').addEventListener('click',async()=>{await db.auth.signOut();user=null;view()});
el('toggleCreate').addEventListener('click',()=>el('create').classList.toggle('hidden'));
el('title').addEventListener('input',()=>{if(!el('slug').dataset.edited)el('slug').value=el('title').value.toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]/g,'').trim().replace(/\s+/g,'-').slice(0,80)});
el('slug').addEventListener('input',()=>el('slug').dataset.edited='1');
el('eventForm').addEventListener('submit',async e=>{e.preventDefault();if(!user)return;el('save').disabled=true;try{const starts=new Date(el('date').value);if(Number.isNaN(starts.valueOf()))throw Error('Enter a valid date');const{error}=await db.from('events').insert({owner_id:user.id,title:el('title').value.trim(),slug:el('slug').value.trim(),access_mode:'invite_only',starts_at:starts.toISOString(),event_date:starts.toISOString(),venue:el('venue').value.trim(),description:el('description').value.trim()});if(error)throw error;msg('createMsg','Event created successfully.');el('eventForm').reset();el('slug').dataset.edited='';await refresh()}catch(err){msg('createMsg',err.message,true)}finally{el('save').disabled=false}});
const{data:{user:current}}=await db.auth.getUser();user=current;view();if(user)await refresh();
</script></body></html>
