<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | WelcomeToEvent</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#352a30;background:#fcf8f5}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #ebdcd7;padding:20px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between}main{max-width:1100px;margin:30px auto;padding:0 20px}h1{font-size:24px;margin:4px 0}h2{font-size:21px}.brand{font-size:12px;letter-spacing:.15em;color:#a86670;font-weight:bold}.panel,.stat{background:#fff;border:1px solid #e9d9d4;border-radius:16px;padding:22px}.login{max-width:430px;margin:70px auto}.muted{color:#776c70}label{display:block;margin:18px 0 6px;font-weight:600}input{font:inherit;padding:12px;border:1px solid #d9c5c0;border-radius:9px;width:100%}button{font:inherit;border:0;background:#a86670;color:#fff;padding:11px 18px;border-radius:9px;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#f6e9e6;color:#693e48}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat span{font-size:13px;color:#776c70}.stat strong{display:block;font-size:30px;margin-top:8px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar input{max-width:320px}.actions{display:flex;gap:10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px;text-align:left}td,th{padding:13px;border-bottom:1px solid #eee5e2}th{font-size:12px;color:#74666a}.yes{color:#27764e}.no{color:#a64c50}.notice{padding:12px;background:#fff1ee;color:#9b3135;border-radius:8px;margin:12px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div><div class="brand">WELCOME TO EVENT</div><h1>Sabriya's Pasni · Admin</h1></div><button id="logout" class="secondary hidden">Log out</button></header>
<main><section id="login" class="panel login"><h2>Admin sign in</h2><p class="muted">Authorized organizer access only.</p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p><button id="loginBtn">Sign in</button></p></form><div id="loginMsg" role="alert"></div></section>
<section id="dashboard" class="hidden"><div class="toolbar"><div><h2>RSVP overview</h2><p class="muted">Live data from Supabase</p></div><div class="actions"><button id="refresh" class="secondary">Refresh</button><button id="export">Export CSV</button></div></div><div id="dataMsg" role="alert"></div>
<div class="stats"><div class="stat"><span>Total responses</span><strong id="responses">—</strong></div><div class="stat"><span>Accepted RSVPs</span><strong id="accepted">—</strong></div><div class="stat"><span>People attending</span><strong id="attendees">—</strong></div><div class="stat"><span>Declined RSVPs</span><strong id="declined">—</strong></div></div>
<div class="panel"><div class="toolbar"><h2>Guest responses</h2><input id="search" placeholder="Search guest names" aria-label="Search guest names"></div><div class="table-wrap"><table><thead><tr><th>Guest name</th><th>RSVP</th><th>People</th><th>Submitted</th></tr></thead><tbody id="rows"></tbody></table></div><p id="count" class="muted"></p></div></section></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://vpspirigruwcgnqlwbla.supabase.co';
const KEY='sb_publishable_O-j4VaGRYGpY8WjwmjMDLA_HWfZ7rns';
const ADMIN_ID='7b5df442-b39c-41ae-b637-4907250797e8';
const db=createClient(SUPABASE_URL,KEY);
const el=id=>document.getElementById(id);
let records=[];
function msg(id,text){el(id).textContent=text;el(id).className=text?'notice':''}
function show(ok){el('login').classList.toggle('hidden',ok);el('dashboard').classList.toggle('hidden',!ok);el('logout').classList.toggle('hidden',!ok)}
async function load(){msg('dataMsg','');el('refresh').disabled=true;try{let all=[];for(let start=0;start<20000;start+=1000){const {data,error}=await db.from('rsvps').select('id,guest_name,attending,guest_count,created_at').order('created_at',{ascending:false}).range(start,start+999);if(error)throw error;all.push(...data);if(data.length<1000)break}records=all;render()}catch(e){msg('dataMsg','Could not load RSVPs: '+e.message)}finally{el('refresh').disabled=false}}
function render(){const yes=records.filter(r=>r.attending===true);el('responses').textContent=records.length;el('accepted').textContent=yes.length;el('attendees').textContent=yes.reduce((n,r)=>n+Number(r.guest_count||0),0);el('declined').textContent=records.filter(r=>r.attending===false).length;const q=el('search').value.toLowerCase().trim();const filtered=records.filter(r=>String(r.guest_name||'').toLowerCase().includes(q));const tbody=el('rows');tbody.replaceChildren();for(const r of filtered){const tr=document.createElement('tr');for(const [value,cls] of [[r.guest_name,''],[r.attending?'Accepted':'Declined',r.attending?'yes':'no'],[r.guest_count,''],[new Date(r.created_at).toLocaleString(),'']]){const td=document.createElement('td');td.textContent=String(value??'');td.className=cls;tr.append(td)}tbody.append(tr)}if(!filtered.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=4;td.textContent='No matching RSVPs';tr.append(td);tbody.append(tr)}el('count').textContent='Showing '+filtered.length+' of '+records.length+' responses'}
el('loginForm').addEventListener('submit',async e=>{e.preventDefault();msg('loginMsg','');el('loginBtn').disabled=true;try{const {data,error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)throw error;if(data.user?.id!==ADMIN_ID){await db.auth.signOut();throw new Error('Not authorized as admin')}el('password').value='';show(true);await load()}catch(err){msg('loginMsg',err.message)}finally{el('loginBtn').disabled=false}});
el('logout').addEventListener('click',async()=>{await db.auth.signOut();records=[];show(false)});
el('refresh').addEventListener('click',load);el('search').addEventListener('input',render);
el('export').addEventListener('click',()=>{const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const lines=[['Guest Name','RSVP','Number Attending','Submitted At'],...records.map(r=>[r.guest_name,r.attending?'Yes':'No',r.guest_count,r.created_at])].map(row=>row.map(cell).join(','));const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const url=window.URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sabriya-pasni-rsvps.csv';document.body.append(a);a.click();a.remove();window.URL.revokeObjectURL(url)});
const {data:{user},error}=await db.auth.getUser();if(!error&&user?.id===ADMIN_ID){show(true);await load()}else{if(user)await db.auth.signOut();show(false)}
</script></body></html>
